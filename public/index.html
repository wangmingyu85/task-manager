<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能任务管理系统</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>智能任务管理系统</h1>
      <p class="subtitle">添加、跟踪并管理你的任务</p>
    </header>

    <section class="add-form">
      <input id="title-input" type="text" placeholder="输入任务标题…" maxlength="120" autocomplete="off" />
      <select id="priority-select">
        <option value="高">高优先级</option>
        <option value="中" selected>中优先级</option>
        <option value="低">低优先级</option>
      </select>
      <button id="add-btn" type="button">添加任务</button>
    </section>

    <section class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="高">高</button>
      <button class="filter-btn" data-filter="中">中</button>
      <button class="filter-btn" data-filter="低">低</button>
    </section>

    <section class="task-list-wrap">
      <ul id="task-list" class="task-list"></ul>
      <p id="empty-tip" class="empty-tip" hidden>暂无任务，添加一条吧。</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
